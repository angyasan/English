name: Add vocab from inbox

on:
  push:
    branches: [main]
    paths:
      - 'inbox.txt'

permissions:
  contents: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Process inbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/process-inbox.js

      - name: Generate audio for new words
        # 音声づくりが失敗しても、単語の追加は止めない（音声は次の更新でまた作られる）
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node scripts/generate-audio.js

      - name: Commit changes
        run: |
          git config user.name "vocab-bot"
          git config user.email "actions@github.com"
          git add index.html inbox.txt
          if [ -d audio ]; then git add -A audio; fi
          git diff --cached --quiet && exit 0
          git commit -m "単語帳を自動更新"
          git pull --rebase origin main
          git push origin HEAD:main
